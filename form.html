<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>MyMamuli.ge — ფორმები</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V" crossorigin="anonymous">
<style>
:root{--ink:#0E1A16;--ink2:#4A5A54;--mute:#93A09B;--line:#E4E8E6;--brand:#0F6B4F;--sand:#F7F5F1;
 --amber:#C8873A;--down:#C0453B;--sh:0 1px 2px rgba(14,26,22,.05),0 10px 34px rgba(14,26,22,.09)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font:400 15.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Georgian",sans-serif;
 color:var(--ink);background:#EDF1EF;padding:26px 16px;display:grid;place-items:start center;min-height:100vh}
button,input,select{font:inherit;color:inherit}

/* ============ ფანჯარა — ლეპტოპზე უფრო ფართო ============ */
.mdl{background:#fff;border-radius:22px;width:100%;max-width:1080px;box-shadow:var(--sh);overflow:hidden}
.mdh{display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line)}
.fl{font-weight:700;font-size:16px;letter-spacing:-.2px}
.fl b{color:var(--brand)}
.mdx{margin-left:auto;width:32px;height:32px;border:0;background:var(--sand);border-radius:9px;cursor:pointer;color:var(--ink2)}
.mdt{display:flex;gap:2px;padding:12px 16px;border-bottom:1px solid var(--line)}
.mdt button{border:0;background:none;padding:10px 18px;border-radius:12px;font-size:14.5px;color:var(--ink2);
 cursor:pointer;font-weight:600;letter-spacing:-.2px;transition:background .16s,color .16s}
.mdt button:hover{background:var(--sand)}
.mdt button.on{background:var(--brand);color:#fff}
.mdb{padding:30px 34px 30px}

/* ============ ბიჯები ============ */
.steps{display:flex;gap:5px;margin-bottom:26px}
.steps i{flex:1;height:4px;border-radius:3px;background:var(--line);
 transition:background .35s cubic-bezier(.22,1,.36,1)}
.steps i.on{background:var(--brand)}
.stitle{font-size:11.5px;font-weight:600;letter-spacing:.4px;color:var(--mute);margin-bottom:10px}
.sh{font-size:26px;font-weight:700;letter-spacing:-.6px;line-height:1.2;margin-bottom:6px}
.ssub{font-size:14.5px;color:var(--ink2);margin-bottom:26px;line-height:1.5;max-width:600px}
.pane{display:none} .pane.on{display:block}

/* ============ ელემენტები ============ */
.grp{margin-bottom:22px}
.grp>label{display:block;font-size:12.5px;font-weight:600;letter-spacing:-.1px;color:var(--mute);margin-bottom:9px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;background:var(--sand);border-radius:14px;padding:11px 17px;font-size:14.5px;font-weight:500;
 color:var(--ink);cursor:pointer;transition:transform .16s cubic-bezier(.22,1,.36,1),background .16s,box-shadow .16s}
.chip:hover{background:#EFEDE8}
.chip:active{transform:scale(.97)}
.chip.on{background:var(--brand);color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(15,107,79,.24)}
.chip.on small{color:rgba(255,255,255,.75)}
.chip small{display:block;font-size:10.5px;color:var(--mute)}

.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.f{display:block}
.f label{display:block;font-size:12.5px;font-weight:600;color:var(--mute);margin-bottom:7px;letter-spacing:-.1px}
.f input,.f select{width:100%;height:50px;border:0;border-radius:14px;padding:0 15px;background:var(--sand);
 outline:0;font-size:16px;transition:background .16s,box-shadow .16s}
.f input::placeholder{color:#B3BCB8}
.f input:focus,.f select:focus{background:#fff;box-shadow:0 0 0 2px var(--brand),0 4px 16px rgba(15,107,79,.1)}
.f .hint{font-size:12.5px;color:var(--mute);margin-top:6px;line-height:1.45}
.f .err{font-size:12.5px;color:var(--down);margin-top:6px;display:none}
.f.bad input{box-shadow:0 0 0 2px var(--down)}
.f.bad .err{display:block}
.f .ok{font-size:12.5px;color:var(--brand);margin-top:6px;font-weight:600;display:none;line-height:1.45}
.f.good .ok{display:block}
.f.good input{box-shadow:0 0 0 2px var(--brand)}
.f textarea{width:100%;height:auto;min-height:92px;border:0;border-radius:14px;padding:13px 15px;
 background:var(--sand);outline:0;font:inherit;font-size:16px;line-height:1.5;resize:vertical;
 transition:background .16s,box-shadow .16s}
.f textarea::placeholder{color:#B3BCB8}
.f textarea:focus{background:#fff;box-shadow:0 0 0 2px var(--brand),0 4px 16px rgba(15,107,79,.1)}

/* ============ „ვეძებ" — ინტრო ახსნა ბიჯი-1-ის თავზე ============
   2026-08-26: George-ის მოთხოვნით — index.html→PAGES.seek-ის იგივე
   ახსნა, ფორმის სტილში, კატეგორიის არჩევამდე (ჯერ ინფორმაცია, შემდეგ
   ქმედება). იხ. task #134. */
.intro{background:var(--sand);border-radius:16px;padding:20px 22px;margin-bottom:26px}
.intro h3{font-size:17px;letter-spacing:-.2px;margin-bottom:8px}
.intro .lead{font-size:14px;color:var(--ink2);line-height:1.55}
.intro h4{font-size:12.5px;font-weight:700;color:var(--ink);margin:16px 0 12px}
.stp .s{display:flex;gap:11px;margin-bottom:11px}
.stp .s:last-child{margin-bottom:0}
.stp .sn{flex:0 0 auto;width:23px;height:23px;border-radius:50%;background:var(--brand);color:#fff;
 font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.stp .st{font-size:13.5px;line-height:1.5}
.stp .st b{display:block;margin-bottom:2px;font-size:14px}
.stp .st span{color:var(--ink2)}

/* ============ ქალაქის ძებნა (რუკის თავზე) ============ */
.citychips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.ccbtn{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 13px;
 font-size:13.5px;font-weight:500;color:var(--ink2);cursor:pointer;white-space:nowrap;font-family:inherit}
.ccbtn:hover{background:var(--sand);border-color:var(--brand)}
.ccbtn:active{transform:scale(.96)}
.ccbtn.qc-m{display:none}      /* დესკტოპზე მხოლოდ qc-d ჩანს, qc-m მობილურზეა */
.citysearch{position:relative;margin-bottom:10px}
.citysearch input{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;
 padding:0 14px;font:inherit;font-size:15px;box-sizing:border-box;background:#fff}
.citysearch input:focus{border-color:var(--brand);outline:0}
.cityres{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border-radius:12px;
 box-shadow:0 6px 24px rgba(14,26,22,.16);overflow:hidden;z-index:20;display:none;max-height:260px;overflow-y:auto}
.cityres.on{display:block}
.cityopt{padding:11px 14px;font-size:14px;cursor:pointer}
.cityopt small{color:var(--mute);font-size:12.5px}
.cityopt:hover{background:var(--sand)}
.cityopt.cityempty{color:var(--mute);cursor:default}
.cityopt.cityempty:hover{background:none}

/* ============ რუკა ============ */
.mapwrap{position:relative;border:0;border-radius:18px;overflow:hidden;height:460px;
 box-shadow:0 1px 3px rgba(14,26,22,.07),0 12px 32px rgba(14,26,22,.09)}
#map,#map2{width:100%;height:100%}
.zgate{position:absolute;inset:0;background:rgba(14,26,22,.55);display:grid;place-items:center;
 color:#fff;font-size:14px;font-weight:600;text-align:center;padding:20px;z-index:5;pointer-events:none;transition:.25s}
.zgate.off{opacity:0;visibility:hidden}
.zgate span{display:block;font-size:12px;font-weight:400;opacity:.85;margin-top:5px}
.pinbtn{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:6;
 background:var(--brand);color:#fff;border:0;border-radius:999px;height:46px;padding:0 24px;
 font-weight:600;font-size:14.5px;letter-spacing:-.2px;cursor:pointer;
 box-shadow:0 6px 22px rgba(0,0,0,.32);transition:transform .16s cubic-bezier(.22,1,.36,1),background .16s}
.pinbtn:active{transform:translateX(-50%) scale(.97)}
.pinbtn[disabled]{background:rgba(255,255,255,.9);color:#6C7A75;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.xhair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;pointer-events:none;
 width:26px;height:26px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.35);display:none}
.xhair.on{display:block}
.xhair:after{content:'';position:absolute;left:50%;top:50%;width:4px;height:4px;background:#fff;border-radius:50%;transform:translate(-50%,-50%)}

.radbox{margin-top:12px;background:var(--sand);border-radius:12px;padding:13px 15px}
.radtop{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.radtop b{font-size:17px;font-variant-numeric:tabular-nums}
.radtop span{font-size:12px;color:var(--ink2)}
.radtop .cnt{margin-left:auto;font-size:12.5px;font-weight:700}
.radtop .cnt.zero{color:var(--amber)}
.radtop .cnt.some{color:var(--brand)}
input[type=range]{width:100%;accent-color:var(--brand)}
.radlbl{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:2px}

.note{display:flex;gap:10px;background:#FDF6EA;border:0;border-radius:15px;
 padding:15px 17px;font-size:13.5px;color:#7A5411;line-height:1.55;margin-top:18px}
.note.ok{background:#EDF5F1;color:#175E46}

.nav{display:flex;gap:10px;margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}
.btn{height:52px;padding:0 26px;border-radius:15px;border:0;font-weight:600;font-size:15.5px;cursor:pointer;
 letter-spacing:-.2px;transition:transform .16s cubic-bezier(.22,1,.36,1),background .16s,box-shadow .16s,opacity .16s}
.btn:active{transform:scale(.975)}
.btn.pri{background:var(--brand);color:#fff;box-shadow:0 4px 16px rgba(15,107,79,.26)}
.btn.pri:hover{background:#0C5A42}
.btn.pri[disabled]{background:var(--sand);color:#AEB8B4;cursor:not-allowed;box-shadow:none;transform:none}
.btn.gh{background:var(--sand);color:var(--ink2)}
.btn.gh:hover{background:#EFEDE8;color:var(--ink)}
.nav .sp{flex:1}

.sum{background:var(--sand);border-radius:18px;padding:20px 22px;font-size:14.5px;line-height:2.1}
.sum div{display:flex;gap:14px}
.sum div span{color:var(--mute);min-width:132px;font-size:13px}
.sum div b{font-weight:600}

/* ⚠️ 2026-08-26, George-ის მოთხოვნით: დადასტურების ეკრანს (done()) ვიზუალი
   არ ჰქონდა და, რადგან postH() მანამდე ამ ეკრანზე არასდროს გამოიძახებოდა,
   მშობელი (index.html-ის .mdb) სქროლს წინა (გრძელი) ბიჯის სიმაღლეზე
   ინარჩუნებდა — მომხმარებელი ბოლომდე ჩამოსქროლილი რჩებოდა და ხედავდა
   მხოლოდ ცარიელ თეთრ არეს ახალი, მოკლე შიგთავსის ქვემოთ. იხ. done()-ისა
   და paneVerify()-ის ბოლოს postH()+{mm:'top'} გამოძახება. */
.donewrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 0 8px}
.doneic{width:60px;height:60px;border-radius:50%;background:var(--brand);color:#fff;
 display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:16px;
 animation:donepop .45s cubic-bezier(.22,1.4,.36,1)}
@keyframes donepop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.donewrap .sh{margin-bottom:8px}
.donewrap .ssub{max-width:460px;margin:0 auto 26px}

/* bare — როცა საიტის მთავარ ფანჯარაშია ჩაშენებული */
body.bare{padding:0;background:transparent;display:block;min-height:0}
body.bare .mdl{max-width:none;border-radius:0;box-shadow:none}
body.bare .mdh,body.bare .mdt{display:none}
body.bare .mdb{padding:2px 2px 8px}
@media(max-width:760px){
 body{padding:0}
 .mdl{border-radius:0;min-height:100vh}
 .mdb{padding:22px 18px 26px}
 .row,.row3{grid-template-columns:1fr;gap:14px}
 .mapwrap{height:320px;border-radius:16px}
 .sh{font-size:23px}
 .ssub{font-size:14px;margin-bottom:22px}
 .chip{padding:12px 16px;font-size:15px}      /* თითისთვის კომფორტული */
 .ccbtn.qc-d{display:none}     /* მობილურზე 13 ნაცვლად 7 ქალაქი ჩანს */
 .ccbtn.qc-m{display:inline-block;padding:9px 13px;font-size:14px}
 .f input,.f select{height:52px;font-size:16px}
 .btn{height:52px;flex:1;justify-content:center;display:flex;align-items:center}
 .nav{gap:9px}
}

/* კონფიდენციალურობის ბლოკი — მშვიდი, არა გამაფრთხილებელი */
.pnote{margin:14px 0 2px;padding:13px 15px;border-radius:12px;
 background:#F1F7F4;border:1px solid #D8E8E1}
.pnh{font-weight:700;font-size:14px;color:var(--brand);margin-bottom:7px}
.pnl{margin:0;padding-left:17px;list-style:disc}
.pnl li{font-size:13px;line-height:1.55;color:var(--ink2);margin:4px 0}
.pnl b{color:var(--ink);font-weight:600}

/* წესების ჩამრთველი */
.tbox{display:flex;gap:10px;align-items:flex-start;margin:16px 0 2px;padding:12px 14px;
 border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:border-color .15s}
.tbox.bad{border-color:var(--down);background:#FEF5F4}
.tbox input{width:18px;height:18px;flex:0 0 auto;margin-top:1px;accent-color:var(--brand);cursor:pointer}
.tbox span{font-size:13px;line-height:1.55;color:var(--ink2)}
.tbox a{color:var(--brand);font-weight:600}

/* გამყიდველის დეკლარაცია */
.dbox{margin:16px 0 2px;padding:13px 15px;border:1px solid var(--line);border-radius:12px}
.dbox.bad{border-color:var(--down);background:#FEF5F4}
.dh{font-weight:700;font-size:13px;color:var(--ink);margin-bottom:9px}
.drow{display:flex;gap:10px;align-items:flex-start;padding:7px 0;cursor:pointer}
.drow+.drow{border-top:1px solid var(--line)}
.drow input{width:18px;height:18px;flex:0 0 auto;margin-top:2px;accent-color:var(--brand);cursor:pointer}
.drow b{display:block;font-size:13.5px;font-weight:600;color:var(--ink)}
.drow i{display:block;font-style:normal;font-size:12.5px;line-height:1.5;color:var(--ink2);margin-top:2px}
.drow a{color:var(--brand)}

/* გამოწერის ჩამრთველი — რბილი, არა სავალდებულო */
.sbox{background:var(--sand);border-color:transparent}
.sbox b{color:var(--ink);font-weight:600}

/* ფოტოს ატვირთვა — ყველა კატეგორიისთვის, მაქს. 10, პირველი = ქავერი */
.phw{margin-top:18px}
.phw>label{display:block;font-size:12.5px;font-weight:600;color:var(--mute);margin-bottom:9px;letter-spacing:-.1px}
/* ⚠️ 2026-08-26: George-ის მოთხოვნით — ერთი დაფარებული „დააჭირე/გადმოთრიე"
   ყუთის ნაცვლად, 5 ცალკე ვიზუალური ჩარჩო (ცარიელი სლოტები), მაგრამ
   მთელი ეს არეალი (ჩარჩოები + მინიშნება) ერთი საერთო კლიკ/drop-არეალია —
   იხ. #lf-drop, რომელიც ახლა #lf-grid-საც შეიცავს. */
.phdrop{border:1.5px dashed var(--line);border-radius:14px;padding:14px;cursor:pointer;
 transition:border-color .15s,background .15s}
.phdrop:hover,.phdrop.drag{border-color:var(--brand);background:#F1F7F4}
.phdrop.bad{border-color:var(--down);background:#FEF5F4}
.phdrop-hint{text-align:center;margin-bottom:12px}
.phdrop-hint b{display:block;font-size:14px;font-weight:600;color:var(--ink)}
.phdrop-hint span{display:block;font-size:12.5px;color:var(--mute);margin-top:4px}
.phbusy{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);padding:10px 2px}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--brand);
 animation:sp .7s linear infinite;flex:0 0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:9px}
.phi{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1;background:var(--sand)}
.phi img{width:100%;height:100%;object-fit:cover;display:block}
/* ცარიელი ჩარჩო — სანამ ფოტო არ აიტვირთება, ადგილი ვიზუალურად ჩანს */
.phi.empty{background:transparent;border:1.5px dashed var(--line);display:flex;
 align-items:center;justify-content:center;color:var(--mute);font-size:26px;font-weight:300}
.phi .cvtag{position:absolute;left:5px;top:5px;background:var(--brand);color:#fff;font-size:10px;font-weight:700;
 padding:2px 7px;border-radius:999px;letter-spacing:.2px}
.phi .rm{position:absolute;right:5px;top:5px;width:22px;height:22px;border-radius:50%;border:0;
 background:rgba(14,26,22,.62);color:#fff;font-size:13px;line-height:1;cursor:pointer;display:flex;
 align-items:center;justify-content:center}
.phi .cb{position:absolute;left:0;right:0;bottom:0;border:0;background:rgba(14,26,22,.62);color:#fff;
 font-size:10.5px;font-weight:600;padding:5px 0;cursor:pointer;opacity:0;transition:opacity .15s}
.phi:hover .cb{opacity:1}
.phi.up{opacity:.55}
.phi .upspin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.phnote{font-size:12px;color:var(--mute);margin-top:9px}
.phnote.bad{color:var(--down)}
</style>
</head>
<body>

<div class="mdl">
 <div class="mdh">
  <div class="fl">My<b>Mamuli</b>.ge</div>
  <button class="mdx">✕</button>
 </div>
 <div class="mdt" id="tabs">
  <button data-t="req" class="on">◎ ვეძებ — მოთხოვნა</button>
  <button data-t="lst">+ ვყიდი — განცხადება</button>
 </div>
 <div class="mdb">
  <div class="steps" id="steps"></div>
  <div id="body"></div>
  <div class="nav">
   <button class="btn gh" id="back">← უკან</button>
   <div class="sp"></div>
   <button class="btn pri" id="next">გაგრძელება →</button>
  </div>

 const slots=Math.max(PH_MIN_SLOTS,S.photos.length);
 let html='';
 for(let i=0;i<slots;i++){

 });

/* კომპრესია — canvas-ზე, გრძელი წიბო PH_EDGE-მდე, JPEG PH_Q ხარისხით.
   შედეგი მაშინვე იტვირთება /api/upload-ზე — მე-4 ბიჯამდე URL უკვე მზადაა. */
function compress(file){
 return new Promise((res,rej)=>{
  const img=new Image(), url=URL.createObjectURL(file);
  img.onload=()=>{
   URL.revokeObjectURL(url);
   let w=img.width,h=img.height;
   const edge=Math.max(w,h);
   if(edge>PH_EDGE){const k=PH_EDGE/edge;w=Math.round(w*k);h=Math.round(h*k)}
   const c=document.createElement('canvas'); c.width=w;c.height=h;
   const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,w,h);
   const tryQ=q=>c.toBlob(b=>{
    if(!b){rej(new Error('canvas'));return}
    if(b.size>PH_TARGET&&q>0.5)tryQ(q-0.1); else res(b);
   },'image/jpeg',q);
   tryQ(PH_Q);
  };
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('decode'))};
  img.src=url;
 });
}
async function uploadOne(file){
 const slot={url:null,name:file.name,up:true};
 S.photos.push(slot); paintPhotos();
 try{
  const blob=await compress(file);
  const r=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':'image/jpeg'},body:blob});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.url)throw new Error(j.error||'upload-failed');
  slot.url=j.url; slot.up=false;
 }catch(e){
  const i=S.photos.indexOf(slot); if(i>-1)S.photos.splice(i,1);
  const n=el('lf-phnote');
  if(n){n.textContent='ატვირთვა ვერ მოხერხდა — სცადე ხელახლა.'; n.classList.add('bad')}
 }
 paintPhotos(); validate();
}
function pickPhotos(files){
 const room=PH_MAX-S.photos.length;
 [...files].slice(0,room).forEach(f=>{
  if(!/^image\//.test(f.type)&&!/\.heic$/i.test(f.name))return;
  uploadOne(f);
 });
}
function bindPhotos(){
 const drop=el('lf-drop'), inp=el('lf-ph'); if(!drop||!inp)return;
 paintPhotos();
 drop.onclick=()=>inp.click();
 inp.onchange=()=>{pickPhotos(inp.files); inp.value=''};
 drop.ondragover=e=>{e.preventDefault(); drop.classList.add('drag')};
 drop.ondragleave=()=>drop.classList.remove('drag');
 drop.ondrop=e=>{e.preventDefault(); drop.classList.remove('drag'); pickPhotos(e.dataTransfer.files)};
}

  declaration()+privacyBox()+anonBox()+subscribeBox()+
 '</div>';

/* ================= ქალაქის ძებნა რუკის თავზე =================
   ჯერ ჩვენი 84 ხელით-შერჩეული ქალაქი/დაბა (CITIES) ეძებნება ლოკალურად,
   მყისვე — ეს ყოველთვის პირველ ადგილას ჩანს. 2026-08-27, George-ის
   მოთხოვნით (სქრინ 2) — ამას ემატება debounce-ილი მოთხოვნა /api/places-ზე,
   რომელიც D1-ის 'place' ცხრილს ეძებს (~5373 ჩანაწერი — პრაქტიკულად
   ყველა საქართველოს დასახლებული პუნქტი, სოფლების ჩათვლით). სერვერული
   შედეგები მხოლოდ დამატებით ემატება, დუბლირების გარეშე, და მხოლოდ მაშინ
   თუ ინტერნეტი აქტიურია — წარუმატებლობისას ლოკალური სია მაინც რჩება.
   არჩევისას რუკა ამ წერტილზე გადაფრინდება (ზუმი 12), ნიშნულს კი
   მომხმარებელი თვითონ სვამს, თავად დაზუმებული. */
function initCitySearch(){
 const box=el('citybox'), res=el('cityres');
 if(!box||!res)return;
 const isEn=()=>typeof LANG!=='undefined'&&LANG==='en';
 const label=c=>isEn()?T(c[0]):c[0];
 let placeTimer=null, reqSeq=0;
 const close=()=>{res.innerHTML='';res.classList.remove('on');clearTimeout(placeTimer)};

 function draw(list){
  if(!list.length){
   res.innerHTML='<div class="cityopt cityempty">'+T('ქალაქი ვერ მოიძებნა')+'</div>';
   res.classList.add('on');
   return;
  }
  res.innerHTML=list.map(c=>'<div class="cityopt">'+c.lbl+(c.region?'<small> — '+c.region+'</small>':'')+'</div>').join('');
  res.classList.add('on');
  res.querySelectorAll('.cityopt:not(.cityempty)').forEach((elx,i)=>elx.onclick=()=>{
   const c=list[i];
   box.value=c.lbl;
   close();
   if(map)map.flyTo({center:[c.lng,c.lat],zoom:12,duration:700});
  });
 }

 function localMatches(q){
  return CITIES.filter(c=>cityNorm(label(c)).includes(q))
   .sort((a,b)=>a[3]-b[3]||a[0].localeCompare(b[0])).slice(0,8)
   .map(c=>({name:c[0], lbl:label(c), lat:c[1], lng:c[2]}));
 }

 const search=()=>{
  const raw=box.value, q=cityNorm(raw);
  clearTimeout(placeTimer);
  if(!q){close();return}
  const loc=localMatches(q);
  draw(loc);
  if(q.length<2)return;
  const mySeq=++reqSeq;
  placeTimer=setTimeout(()=>{
   fetch('/api/places?q='+encodeURIComponent(raw.trim())).then(r=>r.ok?r.json():null).then(j=>{
    if(!j||mySeq!==reqSeq)return;
    const have=new Set(loc.map(x=>x.name));
    const cnt={};
    (j.places||[]).forEach(p=>{cnt[p[0]]=(cnt[p[0]]||0)+1});
    const extra=(j.places||[])
     .filter(p=>!have.has(p[0]))
     .slice(0, Math.max(0, 10-loc.length))
     .map(p=>({name:p[0], lbl:isEn()?(p[3]||p[0]):p[0], lat:p[1], lng:p[2],
       region: cnt[p[0]]>1?(REGION[p[4]]||''):''}));
    if(extra.length) draw(loc.concat(extra));
   }).catch(()=>{/* ოფლაინ — ლოკალური სია მაინც ჩანს */});
  }, 300);
 };
 box.oninput=search;
 box.onfocus=()=>{ if(box.value)search() };
 box.onblur=()=>setTimeout(close,150);   /* დაგვიანება — click-მა rem-ს დაასწროს */
 /* „სწრაფი ქალაქის" ჩიფები — იგივე flyTo ლოგიკა, რაც ძებნის შედეგის
    არჩევას აქვს. box.value-იც ივსება, თითქოს ხელით აკრიფა. */
 document.querySelectorAll('.ccbtn').forEach(b=>{

/* ================= სრული მისამართით ძებნა (გაყიდვის ფორმა, არჩევითი) =================
   2026-08-27, George-ის მოთხოვნით — საკადასტრო კოდის ალტერნატივად,
   ვისაც ეს კოდი არ აქვს/არ იცის, შეუძლია სრული მისამართის ჩაწერით
   იპოვოს ადგილი და ავტომატურად დაისვას ნიშნული (placePin()) — იგივე
   მექანიზმი, რასაც checkCad()-ის ავტომატური განთავსება იყენებს.
   ძებნას /api/geocode აკეთებს (OpenStreetMap Nominatim), საქართველოს
   ფარგლებში. debounce 400მწ — მისამართის მოთხოვნები ქალაქებზე მეტ
   ტექსტს შეიცავს, ნაკლებად ხშირად იცვლება საჭიროება. */
function initAddrSearch(){
 const box=el('addrbox'), res=el('addrres');
 if(!box||!res)return;
 let t=null, seq=0;
 const close=()=>{res.innerHTML='';res.classList.remove('on');clearTimeout(t)};
 function draw(list){
  if(!list.length){ close(); return }
  res.innerHTML=list.map(x=>'<div class="cityopt">'+x.label+'</div>').join('');
  res.classList.add('on');
  res.querySelectorAll('.cityopt').forEach((elx,i)=>elx.onclick=()=>{
   const x=list[i];
   box.value=x.label;
   close();
   if(map)placePin(x.lat,x.lng);
  });
 }
 box.oninput=()=>{
  const q=box.value.trim();
  clearTimeout(t);
  if(q.length<4){close();return}
  const my=++seq;
  t=setTimeout(()=>{
   fetch('/api/geocode?q='+encodeURIComponent(q)).then(r=>r.ok?r.json():null).then(j=>{
    if(!j||my!==seq)return;
    draw(j.results||[]);
   }).catch(()=>{});
  },400);
 };
 box.onblur=()=>setTimeout(close,150);
}
/* ⚠️ ადრე: ნიშნულის დასმის შემდეგ თუ მომხმარებელი ზუმით გამოეცილებოდა
   (17-ზე დაბლა), ღილაკი ჩაითიშებოდა და ტექსტიც "მიუახლოვდი (ზუმი X)"-ზე
   იცვლებოდა — თითქოს საერთოდ ვეღარ შეცვლიდა ადგილს, ერთადერთი გამოსავალი
   "უკან" დაბრუნება იყო. ახლა: თუ ნიშნული უკვე დასმულია, ღილაკი ყოველთვის
   აქტიურია და რუკის ცენტრში გადააქვს ნიშნულს — ზუმის მიუხედავად;
   დამატებით კვლავ შეიძლება პირდაპირ გადათრევაც (marker draggable). */
function gate(){
 const z=map.getZoom(), ok=z>=17, has=!!S.lat;
 const g=el('zg'), p=el('pin'), x=el('xh');
 if(!g)return;
 g.classList.toggle('off', ok||has);
 if(has){
  p.disabled=false;
  p.textContent='◎ ნიშნულის გადატანა აქ';
  x.classList.toggle('on', ok);
 }else{
  p.disabled=!ok;
  p.textContent=ok?'◎ აქ დავსვათ ნიშნული':'მიუახლოვდი (ზუმი '+z.toFixed(1)+')';
  x.classList.toggle('on', ok);
 }
}
let marker=null;
function placePin(lat,lng){
 S.lat=lat; S.lng=lng;
 if(marker)marker.remove();
 const d=document.createElement('div');
 d.style.cssText='width:20px;height:20px;border-radius:50%;background:#0F6B4F;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.45);cursor:grab';
 marker=new maplibregl.Marker({element:d,draggable:true}).setLngLat([lng,lat]).addTo(map);
 marker.on('dragend',()=>{const p=marker.getLngLat();S.lat=p.lat;S.lng=p.lng;drawCircle();countStock();validate()});
 /* ⚠️ 2026-08-26: cadFirst ავტომატური განთავსებისას (checkCad→placePin)
    რუკა ჯერ კიდევ დეფოლტ (თბილისის ცენტრის) ხედშია — თუ აქ არ
    გადავფრინდებით ახალ წერტილზე, ნიშნული ეკრანს გარეთ რჩება და
    მომხმარებელს საერთოდ არაფერი უჩანს, თუმცა S.lat/lng და მარკერი
    სინამდვილეში სწორადაა დაყენებული. "req" tab-ისთვის ამის შემდეგ
    drawCircle() თავად აკეთებს fitBounds-ს, ამიტომ იქ ორმაგი გადაფრენა
    არ გვჭირდება — მხოლოდ "lst"-ზე (გაყიდვა/გაქირავება) ვამატებთ. */
 if(TAB==='lst') map.flyTo({center:[lng,lat], zoom:Math.max(map.getZoom(),17.4), duration:700});
 gate();
 drawCircle(); countStock(); validate();
}
function drawCircle(){
 if(!map||!S.lat||TAB!=='req')return;
 const gj=circle(S.lng,S.lat,S.radius);
 if(map.getSource('c'))map.getSource('c').setData(gj);
 else{
  map.addSource('c',{type:'geojson',data:gj});
  map.addLayer({id:'cf',type:'fill',source:'c',paint:{'fill-color':'#0F6B4F','fill-opacity':.16}});
  map.addLayer({id:'cl',type:'line',source:'c',paint:{'line-color':'#0F6B4F','line-width':2}});
 }
 const b=new maplibregl.LngLatBounds();
 gj.geometry.coordinates[0].forEach(p=>b.extend(p));
 map.fitBounds(b,{padding:46,duration:420,maxZoom:19});
}
/* ცოცხალი მთვლელი — მაძიებელი ხედავს, აქვს თუ არა აზრი ამ რადიუსს */
function countStock(){
 const nt=el('rnote'); if(!nt||!S.lat)return;
 /* ⚠️ 2026-08-26, George-ის მოთხოვნით: ეს ბლოკი ნიშნულის დასმამდე
    display:none-ია და აქ პირველად ჩნდება — გვერდის სიმაღლე იზრდება,

    რომლებიც ამის ქვემოთ დგას, პრაქტიკულად მიუწვდომელი ხდებოდა. */
 nt.style.display='';
 if(TAB==='lst'){

  return;
 }
 /* რადიუსი ავტომატურია — მაძიებელი მას არ ცვლის, მხოლოდ შედეგს ხედავს */
 const r=S.radius>=1000?(S.radius/1000).toFixed(1)+' კმ':S.radius+' მ';
 const n=STOCK.filter(([la,ln,k])=>k===S.cat&&distM(S.lat,S.lng,la,ln)<=S.radius).length;
 if(n){
  nt.className='note ok';
  nt.innerHTML='<span>ამ ადგილას <b>'+r+'-იან რადიუსში</b> ამჟამად <b>'+n+'</b> აქტიური განცხადებაა. '+
   'მოთხოვნის გამოქვეყნებისთანავე ჩამონათვალს მიიღებ ელფოსტაზე.</span>';
 }else{
  nt.className='note';
  nt.innerHTML='<span>ამ ადგილას <b>'+r+'-იან რადიუსში</b> ჯერ აქტიური განცხადება არ არის — '+
   'მაგრამ ახალი განცხადებები ყოველდღე ემატება. როგორც კი შესაფერისი ობიექტი გამოჩნდება, '+
   '<b>პირველი შენ შეიტყობ</b> ელფოსტაზე.</span>';
 }
 setTimeout(postH,60);

/* ================= საკადასტრო კოდის შემოწმება ================= */
/* შემოწმებას სერვერი აკეთებს — /api/cad. ბრაუზერს რეესტრთან პირდაპირი
   კავშირი აღარ აქვს და შედეგიც აქ არაფერს წყვეტს:
   ბაზაში მნიშვნელობა /api/submit-ის საკუთარი შემოწმებიდან ჩაიწერება.
   ე.ი. ამ პასუხის გაყალბება არაფერს იძლევა.

   ⚠️ რეესტრის ხაფანგი (სერვერზეა დაცული): არასწორ კოდზე „ვერ ვიპოვე"
   არ ბრუნდება — ფილტრი იგნორირდება და მილიონობით ჩანაწერი მოდის. */

let cadBusy = false;

async function checkCad(){
 const f=el('fcad'), v=(el('cad').value||'').trim(), out=el('cadok'), err=el('caderr');
 f.classList.remove('bad','good');
 /* ⚠️ 2026-08-25: #cadok (out) CSS-ით მხოლოდ .f.good მდგომარეობაში ჩანდა
    (.f.good .ok{display:block}) — ანუ ნებისმიერ არა-„სრულად წარმატებულ"
    შემთხვევაში (ქსელის შეცდომა, ok:false, ან cad_ok===0) ის, რასაც აქ
    ვწერთ (d.why-ის კონკრეტული მიზეზი), მომხმარებელს საერთოდ არ უჩანდა —
    ჩანდა მხოლოდ სტატიკური, ზოგადი „კოდი რეესტრში ვერ მოიძებნა" (#caderr)
    .bad კლასის მეშვეობით, მიუხედავად იმისა, რომ API-მ რეალურად სპეციფიკური
    და ხშირად სულ სხვა მიზეზი დააბრუნა (მაგ. „მისამართი ვერ ამოვიცანით —
    მოდერატორი შეამოწმებს", რაც ნიშნავს რომ კოდი ნაპოვნია, უბრალოდ
    ავტომატურად ვერ დადასტურდა — ეს არ არის „კოდი არ არსებობს"). აქედან
    ქვემოთ ხილვადობას ხელით ვმართავთ (inline style, class-ზე მაღალი
    სპეციფიკურობით), რომ კონკრეტული შეტყობინება ყოველთვის გამოჩნდეს და
    გენერიულმა ტექსტმა ის არ გადაფაროს. */
 out.style.display='none'; err.style.display='none';
 S.cadAddr=''; S.cadOk=0; S.cadPoly=null;
 if(!v){out.innerHTML='';validate();return}

 if(cadBusy)return; cadBusy=true;
 out.innerHTML='<span style="color:var(--mute)">მოწმდება რეესტრში…</span>';

 let d=null;
 try{
  const q='/api/cad?code='+encodeURIComponent(v)+
    (S.lat?'&lat='+S.lat+'&lng='+S.lng:'');
  const r=await fetch(q,{cache:'no-store'});
  d=await r.json().catch(()=>null);
 }catch(e){}
 cadBusy=false;

 if(!d){
  /* რეესტრი მიუწვდომელია — ამას პირდაპირ ვამბობთ, არ ვიგონებთ შედეგს */
  out.style.display='block';
  out.innerHTML='<span style="color:var(--mute)">რეესტრი ამჟამად არ პასუხობს. '+
    'კოდი შენახულია — მოდერატორი შეამოწმებს.</span>';
  S.cad=v; validate(); return;
 }

 if(!d.ok){
  f.classList.add('bad');
  err.style.display='none';
  out.style.display='block';
  out.innerHTML='<span style="color:var(--bad)">'+(d.why||'რეესტრში ვერ მოიძებნა')+'</span>';
  validate(); return;
 }

 S.cad=v; S.cadAddr=d.addr||''; S.cadOk=d.cad_ok||0; S.cadPoly=d.poly||null;

 /* ⚠️ 2026-08-26: George-ის მოთხოვნით — გაყიდვისას საკადასტრო კოდი
    ისედაც სავალდებულოა, ამიტომ ნიშნულის ხელით დასმა აზრს კარგავს, თუ
    კოდს გეომეტრია ახლავს: სერვერმა (lookupCad) თვითონ იცის ნაკვეთის
    ცენტრი და გვიბრუნებს მას (d.auto+d.lat+d.lng), როცა ჩვენ ჯერ არცერთი
    lat/lng არ გავუგზავნეთ (ანუ ნიშნული ჯერ დასმული არ იყო). თუ რუკა ამ
    ბიჯზეა ჩატვირთული (paneMap-ის ახალი მალსახმობი), placePin()-ს
    პირდაპირ ვიძახებთ — ეს რეალურ ნიშნულს სვამს, მარკერს ხატავს და
    validate()-საც თვითონ უშვებს. თუ რუკა საერთოდ არ არის DOM-ში
    (მაგ. კოდი ბიჯ 3-ზე, „ობიექტი", ხელახლა შემოწმდა) — უბრალოდ
    lat/lng-ს ვაყენებთ პირდაპირ, მარკერის გარეშე. ხელით უკვე დასმულ
    ნიშნულს (S.lat უკვე იყო) არასდროს ვცვლით უხმოდ — ის უკვე lat/lng-ით
    გაიგზავნა მოთხოვნაში, ასე რომ სერვერი ამ განშტოებაში საერთოდ არ
    მოხვდება (d.auto მხოლოდ lat/lng-ის არარსებობისას ბრუნდება). */
 if(d.auto && d.lat!=null && d.lng!=null){
  if(el('map') && typeof map!=='undefined' && map){ placePin(d.lat, d.lng); }
  else { S.lat=d.lat; S.lng=d.lng; }
 }

 /* ⚠️ 2026-08-25: George-ის მოთხოვნით — რეესტრში დაფიქსირებული ფართობი
    და (მხოლოდ მიწისთვის) დანიშნულება ავტომატურად ვსვამთ ველებში, თუ
    კოდი საერთოდ ნაპოვნია (d.ok) — მიწის დანიშნულების/ფართობის სისწორე
    არ არის დამოკიდებული cad_ok დონეზე (პინის დამთხვევაზე), ამიტომ ეს
    ვსვამთ ყველა cad_ok დონეზე, არა მხოლოდ 2/1-ზე. მომხმარებელს კვლავ
    შეუძლია ხელით შეასწოროს — ეს მოსახერხებელი საწყისი მნიშვნელობაა,
    არა დაბლოკილი ველი. კოტეჯებისთვის რეესტრი ხშირად მხოლოდ მიწის
    ფართს აბრუნებს (ცალკე შენობა ხშირად არ ირეგისტრირდება) — ეს
    ცნობილი, მისაღები შეზღუდვაა (George-ის დაზუსტებით). */
 if(d.area){S.area=String(d.area); const ai=el('area'); if(ai)ai.value=S.area}
 if(d.landType&&(S.cat==='land'||S.cat==='invest')){

  if(nType){

 if(d.cad_ok===2){

     ?'ნიშნული ავტომატურად დაისვა ნაკვეთის ცენტრში — რუკაზე ხედავ, გინდა და გადაათრიე ზუსტ ადგილას.'
     :'საზღვარი დადასტურდა — ნიშნული ნაკვეთშია')+(d.area?' · '+d.area.toLocaleString('en-US')+' მ²':'')+'</div>';
 }else if(d.cad_ok===1){
  f.classList.add('good');
  out.style.display='block';
  out.innerHTML='✓ '+d.addr+short+
   '<div style="color:var(--mute);font-weight:400;font-size:12px;margin-top:2px">'+

 }else{
  f.classList.add('bad');
  err.style.display='none';

  out.innerHTML='<span style="color:var(--bad)">'+(d.why||'ადგილი არ ემთხვევა')+'</span>'+
   '<div style="color:var(--mute);font-weight:400;font-size:12px;margin-top:2px">'+
   'კოდი ნაპოვნია რეესტრში — მისამართი ავტომატურად ვერ დადასტურდა, '+
   'მოდერატორი ხელით გადაამოწმებს.</div>';
 }
 validate();
}

/* ================= ვალიდაცია — „ვინ ხარ" ბლოკი (გაზიარებული) =================
   2026-08-26: George-ის რესტრუქტურიზაციამდე ეს მხოლოდ step===3-ში
   (lst-ისთვისაც, req-ისთვისაც) ცალკე გამოძახებული იყო. ახლა req-ს
   რეგისტრაცია სხვა ბიჯზეა (step===1, paneReqWhere), ამიტომ ლოგიკა
   ცალკე ფუნქციად გამოვყავით — ორივე ადგილიდან გამოსაძახებლად. */
function validateWho(){
 const fe=el('femail'), ee=el('emailerr');
 const e=(S.email||'').trim();
 let emsg='';
 if(e){
  /* მხოლოდ ლათინური — „გმაილ.ცომ" ვერ გაივლის */
  if(!/^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(e))emsg='ელფოსტა არასწორია — მხოლოდ ლათინური ასოები.';
  else{
   const d=e.split('@')[1].toLowerCase();
   const typo={'gmail.co':'gmail.com','gmial.com':'gmail.com','gmai.com':'gmail.com',
               'yahoo.co':'yahoo.com','hotmial.com':'hotmail.com','mial.ru':'mail.ru'}[d];
   if(typo)emsg='იქნებ '+e.split('@')[0]+'@'+typo+' გინდოდა?';
  }
 }
 if(fe)fe.classList.toggle('bad',!!emsg);
 if(ee&&emsg)ee.textContent=emsg;
 /* წესებზე თანხმობის გარეშე გაგზავნა არ ხდება */
 /* გამყიდველმა ოთხივე პუნქტი უნდა მონიშნოს, მაძიებელმა — ერთი */
 const decl = TAB==='req' ? !!S.terms : (S.d1&&S.d2&&S.d3&&S.d4);
 let ok=!!S.name&&!!e&&!emsg&&!!decl&&(S.who!=='co'||(!!S.comp&&!!S.cid));
 /* მაძიებელს დამატებით ტელეფონი და პაროლიც ეთხოვება — ანგარიშისთვის.
    სწორ/არასწორ პაროლს (თუ მეილი უკვე რეგისტრირებულია) სერვერი ამოწმებს
    გაგზავნისას — აქ მხოლოდ სიგრძეს ვამოწმებთ. */
 if(TAB==='req'){
  /* ⚠️ 2026-08-26: SESSION-ს (უკვე შესულს) პაროლი აღარ სჭირდება —
     ველიც არ ჩანს (იხ. paneReqWhere). იხ. SESSION-ის კომენტარი S-ის
     განსაზღვრებასთან. */
  if(SESSION){
   ok = ok && !!S.phone;
  }else{
   const pf=el('fpass');
   const passOk=(S.pass||'').length>=8;
   if(pf)pf.classList.toggle('bad', !!S.pass && !passOk);
   ok = ok && !!S.phone && passOk;
  }
 }
 return ok;
}

function validate(){
 let ok=true;
 if(TAB==='req'){
  if(step===0){
   const pmax=+S.pmax||0;
   const fp=el('fpmax');
   if(fp)fp.classList.toggle('bad',!pmax&&S.pmax!=='');
   /* მინიმუმი აღარ ითხოვება მაძიებლისგან — ავტომატურად, ჩუმად ითვლება
      მაქსიმუმის 70%-ად, ისე რომ დანარჩენმა სისტემამ (ბიუჯეტის დიაპაზონის
      ჩვენებამ ბარათებზე, მოდერაციაში, წერილებში) იმუშაოს უცვლელად. */
   const h=el('phint');
   if(h&&pmax)h.textContent='მინიმუმი: $'+fmt(pmax*0.7)+' (ავტომატურად)';
   ok=!!S.cat&&pmax>0;
  }
  if(step===1)ok=!!S.lat&&validateWho();
 }else{
  if(step===0)ok=!!S.cat;
  /* ⚠️ 2026-08-25: paneMap/paneObj ადგილი გაცვალეს (იხ. STEPS.lst-ის
     კომენტარი) — შესაბამისად ვალიდაციის ბიჯებიც შებრუნდა: 1=მდებარეობა,
     2=ობიექტი. */
  if(step===1)ok=!!S.lat;
  if(step===2){
   /* ⚠️ 2026-08-27, George-ის მოთხოვნით — საკადასტრო კოდი (S.cadAddr)
      აღარ ბლოკავს გაგზავნას არც ერთი გარიგების ტიპისთვის (ადრე buy-ს
      მოეთხოვებოდა). ხელით დასმული ნიშნული (S.lat, ვალიდირებულია
      წინა ბიჯზე) საკმარისია — George ხელით ამოწმებს მოდერაციაზე. */
   ok=(+S.price>0)&&(+S.area>0)&&attrsOK()&&
      S.photos.length>0&&!S.photos.some(p=>p.up);
   const n=el('lf-phnote');
   if(n&&!S.photos.length){n.textContent='მინიმუმ 1 ფოტო აუცილებელია.'; n.classList.add('bad')}
  }
  if(step===3)ok=validateWho();
 }
 el('next').disabled=!ok;
}

/* ვერიფიკაციის ეკრანი — დადასტურების გარეშე არაფერი ქვეყნდება */
function paneVerify(){
 el('steps').innerHTML='';
 el('back').style.visibility='hidden';
 el('next').style.display='none';
 el('body').innerHTML='<div class="pane on">'+
  '<div class="sh">დაადასტურე ელფოსტა</div>'+
  '<div class="ssub">6-ნიშნა კოდი გავგზავნეთ მისამართზე <b>'+S.email+'</b>. '+
   'დადასტურებამდე '+(TAB==='req'?'მოთხოვნა':'განცხადება')+' არ ქვეყნდება.</div>'+
  '<div class="f" id="fcode" style="max-width:280px"><label>კოდი</label>'+
   '<input id="code" inputmode="numeric" maxlength="6" placeholder="000000" '+
   'style="font-size:22px;letter-spacing:7px;text-align:center;height:52px">'+
   '<div class="err" id="codeerr">კოდი არასწორია.</div></div>'+
  '<div style="display:flex;gap:9px;margin-top:16px">'+
   '<button class="btn pri" id="vok" disabled>დადასტურება</button>'+
   '<button class="btn gh" id="vre">კოდის თავიდან გაგზავნა</button></div>'+
  (DEV_CODE?'<div class="note ok">სატესტო კოდი: <b>'+DEV_CODE+'</b></div>':'')+
  '<div class="note">წერილი ვერ მოვიდა? შეამოწმე სპამის საქაღალდე. '+
   'კოდი 15 წუთის განმავლობაშია აქტიური.</div>'+
 '</div>';
 /* ⚠️ ეს ეკრანი render()-ის მიღმაა აგებული, ამიტომ იქაური ავტომატური
    თარგმანი აქ არ ეშვება — თვითონ უნდა გამოვიძახოთ. */
 if(typeof LANG!=='undefined'&&LANG==='en'&&typeof trNode==='function')trNode(el('body'));
 const c=el('code');
 c.oninput=()=>{c.value=c.value.replace(/\D/g,'');el('vok').disabled=c.value.length!==6;
   el('fcode').classList.remove('bad')};
 c.focus();
 /* ⚠️ 2026-08-26: იგივე მიზეზით, რაც done()-ში — ეს ეკრანიც render()-ის
    გვერდითაა აგებული და წინა (ხშირად გრძელი) ბიჯიდან მოკლე კოდის
    ველზე გადასვლისას მშობლის .mdb ძველ სქროლ-პოზიციაზე რჩებოდა. */
 postH();
 try{parent.postMessage({mm:'top'},'*')}catch(e){}
 /* სერვერი ამოწმებს: 5 მცდელობა, 15 წუთი ვადა. */
 el('vok').onclick=async()=>{
  const b=el('vok'); b.disabled=true; b.textContent=T('მოწმდება…');
  try{
   const r=await fetch('/api/verify',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email:S.email,code:c.value})});
   const j=await r.json().catch(()=>({}));
   if(!r.ok){
    el('fcode').classList.add('bad');
    const er=el('codeerr');
    if(er)er.textContent = T(
      j.error==='too-many-tries' ? 'მცდელობები ამოიწურა — გამოითხოვე ახალი კოდი.'
    : j.error==='expired'        ? 'კოდს ვადა გაუვიდა — გამოითხოვე ახალი.'
    : j.left!=null               ? 'კოდი არასწორია. დარჩა '+j.left+' მცდელობა.'
    :                              'კოდი არასწორია.');
    b.disabled=false;b.textContent=T('დადასტურება');return;
   }
  }catch(e){
   el('fcode').classList.add('bad');
   const er=el('codeerr'); if(er)er.textContent=T('კავშირი ვერ დამყარდა — სცადე ხელახლა.');
   b.disabled=false;b.textContent=T('დადასტურება');return;
  }
  done();
 };
 /* ⚠️ ადრე ეს ღილაკი მხოლოდ ტექსტს იცვლიდა — სერვერს არაფერს
    უგზავნიდა, ამიტომ ახალი კოდი არასდროს მოდიოდა. ახლა რეალურად
    ითხოვს: /api/submit?resend=1. */
 el('vre').onclick=async()=>{
  const rb=el('vre'); rb.disabled=true; rb.textContent=T('იგზავნება…');
  let ok=false;
  try{
   const r=await fetch('/api/submit?resend=1',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email:S.email})});
   const j=await r.json().catch(()=>({}));
   if(r.status===429){alert(T('ძალიან ბევრი მცდელობა. სცადე მოგვიანებით.'))}
   else{ ok=true; if(j&&j.devCode)DEV_CODE=j.devCode; }
  }catch(e){}
  rb.disabled=false;
  rb.textContent=T(ok?'გაიგზავნა ✓':'კოდის თავიდან გაგზავნა');
  if(ok)setTimeout(()=>{rb.textContent=T('კოდის თავიდან გაგზავნა')},2500);
 };
}

function done(){
 /* ⚠️ 2026-08-26, George-ის მოთხოვნით: დადასტურების ეკრანზე დეტალური

    მოიხსნა — არასაჭირო ინფორმაციაა ამ ეტაპზე, საკმარისია მოკლე,
    თბილი დადასტურება. */
 el('body').innerHTML='<div class="pane on">'+
  '<div class="donewrap">'+

   '<div class="sh">'+(TAB==='req'?'მოთხოვნა გაიგზავნა!':'განცხადება გაიგზავნა!')+'</div>'+
   '<div class="ssub">'+(TAB==='req'

    :'ელფოსტა დადასტურდა და განცხადება გადავიდა განხილვაზე. დამტკიცებისთანავე ელფოსტაზე შეგატყობინებთ.')+
   '</div>'+
  '</div>'+
  '<div class="note"><i>✉</i><span>ყველა სიახლე ელფოსტაზე მოგივა — ეს ფანჯარა თამამად დახურე.</span></div>'+
 '</div>';
 el('steps').innerHTML=''; el('back').style.visibility='hidden'; el('next').style.display='none';
 if(typeof LANG!=='undefined'&&LANG==='en'&&typeof trNode==='function')trNode(el('body'));
 /* ⚠️ 2026-08-26: render()-ს გვერდს ვუვლით (ეს ცალკე ეკრანია), ამიტომ
    postH()-ც და მშობლისთვის სქროლის თავში დაბრუნების მოთხოვნაც აქ
    თვითონ უნდა გავაგზავნოთ — თორემ .mdb წინა (გრძელი) ბიჯის სქროლ-
    პოზიციაზე რჩება და მომხმარებელს ეს ეკრანი საერთოდ ცარიელი ჩანს. */
 postH();
 try{parent.postMessage({mm:'top'},'*')}catch(e){}
 /* ⚠️ 2026-08-27, George-ის მოთხოვნით — GA4 key events. done() ზუსტად
    ის წერტილია, სადაც მოთხოვნა/განცხადება რეალურად სრულდება (ან
    ავტო-დადასტურებით, ან ელფოსტის კოდის შემდეგ) — არა ღილაკზე ჭერისას,
    როცა ჯერ კიდევ მოსალოდნელია ვერიფიკაცია. gtag თვითონ form.html-ში
    არ ტვირთულობს (იხ. ზემოთ postMessage-ის კომენტარი) — მშობელი
    (index.html) ისმენს {mm:'ga'}-ს და თვითონ იძახებს gtag('event',...). */
 try{

  if(SIGNUP_NEW)parent.postMessage({mm:'ga', name:'sign_up'}, '*');
 }catch(e){}
}

 if(step<lastStep()){step++;render();return}
 /* სერვერზე გაგზავნა; თუ backend ჯერ არ არის — პროტოტიპი განაგრძობს */
 const btn=el('next'); btn.disabled=true; btn.textContent=T('იგზავნება…');
 /* pmin ფორმაში აღარ ითხოვება — მაქსიმუმის 70%-ად ითვლება ავტომატურად.
    amin ასევე აღარსად ითხოვება (ველი UI-დან ყველა კატეგორიისთვის
    მოცილებულია) — აქაც ცარიელი ვაგზავნით, თუნდაც S.amin ძველი
    კატეგორიიდან იყოს დარჩენილი. */
 const autoPmin=S.pmax?Math.round(+S.pmax*0.7):'';
 const body={kind:TAB==='lst'?'lst':'req',cat:S.cat,deal:S.deal,period:S.period,
  lat:S.lat,lng:S.lng,radius:S.radius,
  amin:'',amax:S.amax,pmin:autoPmin,pmax:S.pmax,note:S.note,dsc:S.desc,
  area:S.area,price:S.price,cad:S.cad,  /* addr აღარ იგზავნება — სერვერი რეესტრიდან იღებს */
  ttl:(catOf(S.cat).n+' · '+(S.cadAddr||'')).slice(0,160),
  name:S.name,email:S.email,tel:S.phone?('+'+dialOf(S.cc)+' '+S.phone):'',
  who:S.who,comp:S.comp,cid:S.cid,attrs:A,pass:S.pass,
  photos:TAB==='lst'?S.photos.filter(p=>p.url).map(p=>p.url):[],
  terms:(TAB==='req'?!!S.terms:!!(S.d1&&S.d2&&S.d3&&S.d4)),
  decl:(TAB==='req'?null:{d1:!!S.d1,d2:!!S.d2,d3:!!S.d3,d4:!!S.d4}),
  sub:!!S.sub,
  visibility:(TAB==='lst'&&S.priv)?'private':'public',
  anon:!!(TAB==='lst'&&S.anon),
  src_req:(TAB==='lst'&&S.srcReq)?S.srcReq:undefined};
 try{
  const r=await fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(r.status===409&&j.error==='phone-taken'){alert(T('ეს ტელეფონის ნომერი უკვე სხვა ანგარიშზეა რეგისტრირებული.'));btn.disabled=false;btn.textContent=T('გაგზავნა');return}
  if(r.status===409&&j.error==='limit'){alert(T('უფასო ლიმიტი ამოწურულია — მაქსიმუმ ')+j.cap+T(' აქტიური ')+(TAB==='req'?T('მოთხოვნა.'):T('განცხადება.'))+' '+T('ამის ზემოთ განთავსება ფასიანი გახდება — ეს ფუნქცია მალე ჩაირთვება.'));btn.disabled=false;btn.textContent=T('გაგზავნა');return}
  if(r.status===429){alert(T('ძალიან ბევრი მცდელობა. სცადე მოგვიანებით.'));btn.disabled=false;btn.textContent=T('გაგზავნა');return}
  /* ⚠️ 2026-08-26: George-ის მოთხოვნით დამატებული პაროლის ლოგიკის
     შეცდომები — თუ ეს მეილი უკვე რეგისტრირებულია და პაროლი არ ემთხვევა,
     ან პაროლი საერთოდ სუსტია (< 8 სიმბოლო). ორივე შემთხვევაში
     „ვინ ხარ" ბიჯზე ვაბრუნებთ, პაროლის ველს ვუსვამთ წითელს. */
  if((r.status===401&&j.error==='wrong-pass')||(r.status===400&&j.error==='weak-pass')){
   step=lastStep(); render();
   const pf=el('fpass'), pe=el('passerr');
   if(pf)pf.classList.add('bad');
   if(pe)pe.textContent=T(j.error==='wrong-pass'
     ?'პაროლი არასწორია — ეს მეილი უკვე რეგისტრირებულია. ჩაწერე შენი არსებული პაროლი.'
     :'პაროლი მინ. 8 სიმბოლო უნდა იყოს.');
   btn.disabled=false;btn.textContent=T('გაგზავნა');return;
  }
  if(j&&j.devCode)DEV_CODE=j.devCode;
  /* ⚠️ 2026-08-27, George-ის მოთხოვნით — GA4 `sign_up` key event: submit.js
     დროშად აბრუნებს, ეს ნამდვილად ახალი ანგარიშია თუ უკვე არსებულის
     მორიგი გაგზავნაა. done()-ში (გარიგების რეალურად დასრულების წერტილში)
     ვიყენებთ — არა აქ, რომ ერთხელაც არ ამოვარდეს autoVerified-ის გარეშე
     ნაკადში (კოდის დადასტურებამდე ჯერ არაფერი დასრულებულა). */
  if(j&&j.isNewUser)SIGNUP_NEW=true;
  /* ⚠️ comp_ok („ულიმიტო") ანგარიშისთვის სერვერი კოდის გარეშე პირდაპირ
     ადასტურებს draft→pending-ს (იხ. submit.js) — ასეთ შემთხვევაში
     ვერიფიკაციის ეკრანი საერთოდ არ სჭირდება, პირდაპირ done()-ზე გადავდივართ. */
  if(j&&j.autoVerified){btn.disabled=false;done();return}
 }catch(e){}
 btn.disabled=false; paneVerify();
};
let DEV_CODE='', SIGNUP_NEW=false;
el('back').onclick=()=>{if(step){step--;render()}};
el('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{
 el('tabs').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
 b.classList.add('on'); TAB=b.dataset.t; step=0;
 el('next').style.display=''; render();
});

/* ✕ — საიტზე დაბრუნება (ან ფორმის თავიდან დაწყება, თუ პირდაპირ გაიხსნა) */
function closeForm(){
 if(history.length>1&&document.referrer&&!/form\.html/.test(document.referrer)){history.back();return}
 try{location.href='index.html'}catch(e){}
}
const BARE=/[?&]bare/.test(location.search);
if(BARE)document.body.classList.add('bare');
document.querySelector('.mdx').onclick=closeForm;
addEventListener('keydown',e=>{if(e.key==='Escape'&&!BARE)closeForm()});

S.cc=detectCountry();
/* #lst ან #req — საიტიდან პირდაპირ სწორ ფორმაზე */
if(location.hash==='#lst'){TAB='lst';
 el('tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t==='lst'));}
/* ?req=<id> — მყიდველის კონკრეტულ მოთხოვნაზე პასუხად („შეთავაზების გაგზავნა" რუკიდან).
   ეს ყოველთვის განცხადების ფორმაა — მოთხოვნას მოთხოვნით არ პასუხობენ. */
{
 const qp=new URLSearchParams(location.search);
 const rq=qp.get('req');
 if(rq){
  S.srcReq=rq; TAB='lst';
  el('tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t==='lst'));
  /* კონკრეტულ მოთხოვნაზე პასუხის ფორმას გადმოცემული აქვს კატეგორია,
     გარიგება, სასურველი ფართობი და ბიუჯეტი — ეს ყველაფერი წინასწარ
     ივსება, მომხმარებელს მხოლოდ დათანხმება/დაზუსტება რჩება. */
  const qcat=qp.get('cat');
  if(qcat&&catOf(qcat)){ S.cat=qcat; const c=catOf(qcat); S.radius=c.d; if(c.buyOnly)S.deal='buy'; }
  const qdeal=qp.get('deal');
  if(qdeal&&(qdeal==='buy'||qdeal==='rent')){
   const c=catOf(S.cat); if(!(c&&c.buyOnly))S.deal=qdeal;
  }
  const qarea=qp.get('area'); if(qarea&&+qarea>0)S.area=qarea;
  const qprice=qp.get('price'); if(qprice&&+qprice>0)S.price=qprice;
 }
}
/* ═══════ თარგმანი ═══════
   ფორმა iframe-შია და მშობლის observer მას ვერ სწვდება — საკუთარი გვჭირდება.
   ენა მოდის ან URL-იდან (?lang=en), ან localStorage-იდან — index.html
   იქ ინახავს არჩევანს და ორივე ერთსა და იმავე გასაღებს კითხულობს. */
try{
 if(typeof applyLang==='function'){
  applyLang();
  if(typeof mo!=='undefined'&&mo.observe)
   mo.observe(document.body,{childList:true,subtree:true,characterData:true});
  /* მშობელს ენის შეცვლა ფორმის გახსნის შემდეგაც შეუძლია */
  addEventListener('message',e=>{
   if(e.data&&e.data.mmLang&&e.data.mmLang!==LANG){
    try{localStorage.setItem('mm_lang',e.data.mmLang)}catch(_){}
    location.reload();
   }
  });
 }
}catch(e){}
/* ⚠️ 2026-08-26: სესიის შემოწმება — იხ. SESSION-ის კომენტარი ზემოთ.
   no-store, რომ ძველი cache-ირებული პასუხი ვინმეს არასწორად შესულად
   არ დაანახოს. */
fetch('/api/auth',{cache:'no-store'}).then(r=>r.json()).then(d=>{
 if(d&&d.ok&&d.user){
  SESSION=d.user;
  if(!S.name)S.name=d.user.name||'';
  if(!S.email)S.email=d.user.email||'';
  /* ⚠️ 2026-08-26: George-ის მოთხოვნით — ტელეფონიც ისე ავტომატურად
     ჯდება, როგორც სახელი და მეილი. phone_full ფორმატია "+<კოდი> <ნომერი>". */
  if(!S.phone && d.user.tel){
   const m=String(d.user.tel).match(/^\+(\d+)\s*(.*)$/);
   if(m){
    const cc=ccOfDial(m[1]);
    if(cc){ S.cc=cc; S.phone=m[2]; }
   }
  }
  render();
 }
}).catch(()=>{});
render();
</script>
</body>
</html>
