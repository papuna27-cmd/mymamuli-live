<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MyMamuli — მოდერაცია</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V" crossorigin="anonymous">
<style>
:root{--ink:#0E1A16;--ink2:#4A5A54;--mute:#8E9B96;--line:#E7EBE9;--brand:#0F6B4F;
 --sand:#F5F6F5;--amber:#C8873A;--down:#C0453B;--blue:#2F5C93}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Georgian",sans-serif;
 color:var(--ink);background:#fff;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

/* ============ ჰედერი ============ */
header{flex:0 0 auto;background:#fff;z-index:20;padding-top:env(safe-area-inset-top)}
.hb{display:flex;align-items:center;gap:8px;padding:12px 16px 2px}
.logo{font-weight:700;font-size:17px;letter-spacing:-.3px;color:var(--brand)}
.logo b{color:var(--ink);font-weight:700}
.hb .md{font-size:14px;color:var(--ink2);display:flex;align-items:center;gap:5px;margin-left:auto}
.hb .md i{font-style:normal;color:var(--brand)}
.kbtn{width:32px;height:32px;border-radius:10px;background:var(--sand);display:grid;place-items:center;
 font-size:14px;color:var(--ink2);margin-left:8px}

/* პილები */
.pills{display:flex;gap:8px;padding:10px 16px 0;flex-wrap:wrap}
.pills button{height:38px;padding:0 16px;border-radius:19px;border:1px solid var(--line);background:#fff;
 font-size:13.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:7px;
 transition:transform .16s cubic-bezier(.22,1,.36,1),background .16s,border-color .16s,color .16s}
.pills button:active{transform:scale(.97)}
.pills button .n{font-size:12.5px;font-weight:700;opacity:.55}
.pills button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pills button.on .n{opacity:.8}
.pills.amber button.on{background:var(--amber);border-color:var(--amber)}

.warn{background:#FDF6EA;color:#7A5411;font-size:12.5px;padding:10px 16px;text-align:center;
 flex:0 0 auto;line-height:1.45}
.warn button{background:#8A5D14;color:#fff;padding:5px 11px;border-radius:8px;font:600 12px inherit;margin-left:6px}
.warn code{background:#fff;padding:1px 5px;border-radius:4px;font-size:11.5px}

/* პროგრესი */
.prog{padding:14px 16px 0;font-size:13px;color:var(--ink2);font-weight:600}
.prog .bar{height:3px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden;max-width:160px}
.prog .bar i{display:block;height:100%;background:var(--brand);border-radius:2px;transition:width .3s}

/* ============ ბარათი ============ */
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;
 padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}

/* ფოტოს ლენტა */
.ph{display:flex;gap:8px;padding:12px 16px 0;overflow-x:auto;scrollbar-width:none}
.ph::-webkit-scrollbar{display:none}
.ph .th{position:relative;flex:0 0 calc((100% - 16px)/3);aspect-ratio:4/3;border-radius:12px;overflow:hidden;
 background:var(--sand);cursor:zoom-in}
.ph .th img{width:100%;height:100%;object-fit:cover;display:block}
.ph .th .cnt{position:absolute;right:6px;top:6px;background:rgba(14,26,22,.72);color:#fff;
 font:700 10.5px/1 inherit;padding:4px 6px;border-radius:6px}
.ph .no{flex:1;aspect-ratio:16/6;display:grid;place-items:center;background:var(--sand);
 border-radius:12px;color:var(--mute);font-size:13px}

.hd{padding:16px 16px 0}
.hd .pr{display:flex;align-items:baseline;gap:9px}
.hd .pr b{font-size:28px;font-weight:700;letter-spacing:-.9px;line-height:1}
.hd .pr span{font-size:14px;color:var(--mute);font-weight:500}
.hd h1{font-size:16.5px;font-weight:600;line-height:1.4;margin-top:9px}
.hd .loc{font-size:13.5px;color:var(--ink2);margin-top:7px;display:flex;align-items:center;gap:6px}
.hd .loc i{font-style:normal;color:var(--brand)}
.tag{display:inline-block;font:700 10.5px/1 inherit;padding:5px 9px;border-radius:7px;margin-bottom:10px}
.tag.new{background:#FDF6EA;color:#8A5D14}
.tag.req{background:#EEF3FA;color:var(--blue)}

/* ფაქტების ბლოკი — ხატულებით, კიდით */
.facts{margin:16px 16px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.fr{display:flex;align-items:center;gap:10px;padding:12px 14px;font-size:14px}
.fr+.fr{border-top:1px solid var(--line)}
.fr i{font-style:normal;width:18px;text-align:center;color:var(--mute);font-size:14px;flex:0 0 auto}
.fr span{color:var(--ink2);flex:1}
.fr b{font-weight:600;text-align:right;max-width:58%}
.fr a{color:var(--brand);text-decoration:none}

.dsc{margin:16px 16px 0;font-size:14px;line-height:1.65;color:var(--ink2);white-space:pre-wrap}

/* რუკა */
.mapbox{position:relative;margin:16px 16px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
#map{height:170px;background:var(--sand)}
.mapbox .exp{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:9px;
 background:rgba(255,255,255,.94);display:grid;place-items:center;color:var(--ink2);font-size:13px;
 box-shadow:0 1px 4px rgba(0,0,0,.14)}

/* ავტორი */
.who{display:flex;align-items:center;gap:11px;margin:16px 16px 0;padding:13px 14px;
 border:1px solid var(--line);border-radius:14px}
.who .av{width:38px;height:38px;border-radius:50%;background:var(--sand);display:grid;place-items:center;
 color:var(--mute);flex:0 0 auto;font-size:16px}
.who .i{flex:1;min-width:0}
.who .nm{font-size:14px;font-weight:600}
.who .em{font-size:12.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis}
.who .st{font-size:12px;color:var(--mute);margin-top:3px}
.badge{font:600 11px/1 inherit;padding:6px 9px;border-radius:8px;background:#EDF5F1;color:var(--brand);
 flex:0 0 auto;border:1px solid #D4E6DD}
.badge.warn{background:#FDF6EA;color:#8A5D14;border-color:#F0E0C4}

.flagbox{margin:14px 16px 0;background:#FDF6EA;color:#8A5D14;border-radius:12px;padding:11px 13px;
 font-size:12.5px;line-height:1.5;display:flex;gap:8px}

/* ცარიელი */
.done{padding:70px 24px;text-align:center}
.done .ring{width:104px;height:104px;margin:0 auto;border-radius:50%;background:var(--brand);
 display:grid;place-items:center;color:#fff;font-size:44px;
 box-shadow:0 0 0 10px rgba(15,107,79,.10),0 0 0 22px rgba(15,107,79,.05)}
.done h2{font-size:21px;margin-top:26px;font-weight:700;letter-spacing:-.5px;line-height:1.3}
.done p{color:var(--mute);font-size:14px;margin-top:10px}
.done .rf{margin-top:26px;height:52px;padding:0 30px;border-radius:14px;background:var(--brand);color:#fff;
 font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:9px}

/* ============ ქმედებები ============ */
.act{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);
 -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);
 padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.actin{max-width:560px;margin:0 auto;display:flex;gap:9px}
.ab{flex:1;height:54px;border-radius:14px;font-weight:600;font-size:14.5px;
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
 border:1.5px solid transparent;
 transition:transform .16s cubic-bezier(.22,1,.36,1),background .16s}
.ab:active{transform:scale(.96)}
.ab .em{font-size:17px;line-height:1}
.ab.no{border-color:#EFD3D0;background:#FDF4F3;color:var(--down)}
.ab.hd{border-color:#F0E0C4;background:#FDF9F1;color:#9A6516}
.ab.edit{border-color:#D6E2F0;background:#F2F6FC;color:var(--blue)}
.ab.del{border-color:#EFD3D0;background:#FDF4F3;color:var(--down)}
.ab.ok{flex:1.6;background:var(--brand);color:#fff;flex-direction:row;gap:8px;font-size:15.5px}

/* ============ კორექტირების ფურცელი ============ */
.ef{margin-bottom:12px}
.ef label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.ef input,.ef textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;
 font:inherit;font-size:14.5px;color:var(--ink);background:#fff}
.ef textarea{resize:vertical;min-height:74px;line-height:1.5}
.ef input:focus,.ef textarea:focus{outline:none;border-color:var(--brand)}
.efrow{display:flex;gap:10px}
.efrow .ef{flex:1}
.esave{width:100%;height:50px;border-radius:14px;font-size:15px;font-weight:600;
 color:#fff;background:var(--brand);margin-top:4px}
.esave[disabled]{background:var(--sand);color:var(--mute)}

/* ფურცელი */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(14,26,22,.42);display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheetin{width:100%;max-width:560px;margin:0 auto;background:#fff;border-radius:22px 22px 0 0;
 padding:22px 16px calc(18px + env(safe-area-inset-bottom));max-height:82vh;overflow-y:auto;
 animation:up .26s cubic-bezier(.22,1,.36,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheetin h3{font-size:17px;font-weight:700;letter-spacing:-.3px;margin-bottom:16px}
.sheetin .r{width:100%;display:flex;align-items:center;gap:12px;padding:14px 4px;font-size:14.5px;text-align:left}
.sheetin .r+.r{border-top:1px solid var(--line)}
.sheetin .r em{font-style:normal;color:var(--mute);width:16px;flex:0 0 auto}
.sheetin .r s{margin-left:auto;width:21px;height:21px;border-radius:50%;border:1.5px solid var(--line);
 flex:0 0 auto;text-decoration:none;transition:.14s}
.sheetin .r:active s{border-color:var(--brand);box-shadow:inset 0 0 0 5px var(--brand)}
.sheetin .cancel{width:100%;height:50px;border-radius:14px;font-size:15px;font-weight:600;
 color:var(--ink2);background:var(--sand);margin-top:14px}

/* გაუქმება */
.undo{position:fixed;left:16px;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:50;
 max-width:528px;margin:0 auto;background:var(--ink);color:#fff;border-radius:14px;padding:13px 15px;
 display:flex;align-items:center;gap:12px;font-size:13.5px;overflow:hidden;
 box-shadow:0 10px 30px rgba(0,0,0,.28);opacity:0;transform:translateY(12px);pointer-events:none;
 transition:.24s cubic-bezier(.22,1,.36,1)}
.undo.on{opacity:1;transform:none;pointer-events:auto}
.undo button{color:#7FD3B0;font-weight:700;margin-left:auto}
.undo i.bar{position:absolute;left:0;bottom:0;height:3px;background:#7FD3B0}

.lbx{position:fixed;inset:0;background:#000;display:none;place-items:center;z-index:80;padding:16px}
.lbx.on{display:grid}
.lbx img{max-width:100%;max-height:100%;border-radius:12px}

/* ============ ლეპტოპი ============ */
@media(min-width:900px){
 body{background:#F3F5F4}
 header{background:transparent;padding-top:18px}
 .hb,.pills{max-width:1020px;margin-left:auto;margin-right:auto}
 .warn{max-width:1020px;margin:12px auto 0;border-radius:12px}
 main{padding:0 20px calc(96px + env(safe-area-inset-bottom))}
 .wrap{max-width:1020px;background:#fff;border-radius:20px;margin-top:16px;padding:0 0 20px;
  box-shadow:0 1px 3px rgba(14,26,22,.06),0 12px 36px rgba(14,26,22,.08)}
 .prog{padding:18px 22px 0}
 .ph{padding:14px 22px 0}
 .ph .th{flex:0 0 calc((100% - 32px)/5)}
 /* ორი სვეტი */
 .cols{display:grid;grid-template-columns:1.15fr .85fr;gap:0 22px;padding:0 22px}
 .hd{padding:18px 0 0}
 .facts,.dsc,.flagbox{margin-left:0;margin-right:0}
 .mapbox,.who{margin-left:0;margin-right:0}
 #map{height:210px}
 .actin{max-width:1020px}
 .undo{max-width:1020px;left:20px;right:20px}
 .done{padding:80px 24px}
}
</style>
</head>
<body>

<header>
  <div class="hb">
    <div class="logo"><b>My</b>Mamuli</div>
    <div class="md">მოდერაცია <i>◈</i></div>
    <a href="users.html" style="margin-left:8px;font-size:12px;font-weight:600;color:var(--ink2);text-decoration:none">მომხმარებლები</a>
    <button class="kbtn" id="rfrTop" title="სიის განახლება">↻</button>
    <button class="kbtn" id="kbtn" title="ადმინის გასაღები">🔑</button>
  </div>
  <div class="pills" id="secs">
    <button data-s="pending" class="on">დასადასტურებელი <span class="n" id="n-pending">0</span></button>
    <button data-s="active">დადასტურებული <span class="n" id="n-active">0</span></button>
  </div>
  <div class="pills" id="tabs">
    <button data-k="lst" class="on">ვყიდი <span class="n" id="n-lst">0</span></button>
    <button data-k="req">ვეძებ <span class="n" id="n-req">0</span></button>
  </div>
</header>

<div class="warn" id="warn"></div>

<main id="main"><div class="wrap" id="wrap"></div></main>

<div class="act" id="act">
  <div class="actin">
    <button class="ab no" id="bNo"><span class="em">✕</span>უარი</button>
    <button class="ab hd" id="bHd"><span class="em">⏸</span>ჰოლდი</button>
    <button class="ab edit" id="bEdit"><span class="em">✎</span>კორექტირება</button>
    <button class="ab del" id="bDel"><span class="em">🗑</span>წაშლა</button>
    <button class="ab ok" id="bOk"><span class="em">✓</span>დადასტურება</button>
  </div>
</div>

<div class="undo" id="undo"><span id="undoT"></span><button id="undoB">დაბრუნება</button><i class="bar" id="undoBar"></i></div>

<div class="sheet" id="sheet">
  <div class="sheetin">
    <h3>აირჩიე უარის მიზეზი</h3>
    <div id="reasons"></div>
    <button class="cancel" id="rcancel">გაუქმება</button>
  </div>
</div>

<!-- ⚠️ 2026-08-26, George-ის მოთხოვნით: მოდერატორის კორექტირების ფურცელი —
     ველების ხელით გასწორება დადასტურებამდე (task #136). ველების ნაკრები
     drawEditFields()-ში დინამიურად აგება (lst/req სხვადასხვაა). -->
<div class="sheet" id="esheet">
  <div class="sheetin">
    <h3>განაცხადის კორექტირება</h3>
    <div id="efields"></div>
    <button class="esave" id="esave">შენახვა</button>
    <button class="cancel" id="ecancel">გაუქმება</button>
  </div>
</div>

<div class="lbx" id="lbx"><img id="lbxI" alt=""></div>

<div id="lsheet" style="display:none;position:fixed;inset:0;z-index:90;background:rgba(14,26,22,.42);align-items:center;justify-content:center;padding:16px">
  <form id="lform" autocomplete="on" style="background:#fff;border-radius:16px;padding:22px;width:min(340px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)">
    <h3 style="font-size:16px;font-weight:700;margin-bottom:14px">ადმინის სესია</h3>
    <input type="text" name="username" autocomplete="username" value="admin" style="position:absolute;left:-9999px;top:auto" tabindex="-1" aria-hidden="true">
    <label for="lpass" style="font-size:12.5px;color:var(--ink2);display:block;margin-bottom:6px">ADMIN_KEY</label>
    <input type="password" id="lpass" name="password" autocomplete="current-password" placeholder="ADMIN_KEY"
      style="width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:14px;margin-bottom:8px;box-sizing:border-box">
    <div id="lerr" style="color:var(--down);font-size:12.5px;min-height:16px;margin-bottom:8px"></div>
    <div style="display:flex;gap:8px">
      <button type="button" id="lcancel" style="flex:1;height:42px;border-radius:10px;background:var(--sand);font:inherit;font-weight:600;border:0;cursor:pointer">გაუქმება</button>
      <button type="submit" style="flex:1;height:42px;border-radius:10px;background:var(--brand);color:#fff;font:inherit;font-weight:600;border:0;cursor:pointer">შესვლა</button>
    </div>
  </form>
</div>

function drawMap(o,isReq){
 const box=el('map'); if(!box||!window.maplibregl)return;
 box.innerHTML='';
 map=new maplibregl.Map({container:box,attributionControl:false,
  style:{version:8,sources:{sat:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:18}},
   layers:[{id:'sat',type:'raster',source:'sat'}]},
  center:[o.lng,o.lat],zoom:isReq?12:15.5});
 map.on('load',()=>{
  if(isReq&&o.radius){
   const pts=[],R=o.radius/6378137*(180/Math.PI);
   for(let i=0;i<=64;i++){const a=i/64*2*Math.PI;
    pts.push([o.lng+R*Math.cos(a)/Math.cos(o.lat*Math.PI/180),o.lat+R*Math.sin(a)])}
   map.addSource('c',{type:'geojson',data:{type:'Feature',geometry:{type:'Polygon',coordinates:[pts]}}});
   map.addLayer({id:'cf',type:'fill',source:'c',paint:{'fill-color':'#C8873A','fill-opacity':.2}});
   map.addLayer({id:'cl',type:'line',source:'c',paint:{'line-color':'#C8873A','line-width':2}});
  }else{
   const m=document.createElement('div');
   m.style.cssText='width:16px;height:16px;border-radius:50%;background:#0F6B4F;border:3px solid #fff;box-shadow:0 2px 9px rgba(0,0,0,.4)';
   new maplibregl.Marker({element:m}).setLngLat([o.lng,o.lat]).addTo(map);
  }
 });
 const e=el('mexp'); if(e)e.onclick=()=>{
  const b=el('map'); b.style.height=b.style.height==='420px'?'':'420px';
  setTimeout(()=>{try{map.resize()}catch(x){}},80);
 };
}

 if(LIVE){
  try{
   const r=await fetch('/api/mod',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({kind:TAB,id:o.id,action:'edit',fields})});
   if(!r.ok)throw 0;
  }catch(e){
   btn.disabled=false; btn.textContent='შენახვა';
   alert('შენახვა ვერ მოხერხდა — სცადე ხელახლა.'); return;
  }
 }
 /* ⚠️ ლოკალურ ობიექტსაც ვანახლებთ — რომ ბარათმა დაუყოვნებლივ
    ასახოს ცვლილება, გვერდის ხელახლა ჩატვირთვის გარეშე. */
 if(isReq){
  o.dsc=fields.note;
  o.price_min=+fields.price_min||0; o.price_max=+fields.price_max||0;
  o.area_min=+fields.area_min||0; o.area_max=+fields.area_max||0;
 }else{
  o.ttl=fields.ttl; o.price=+fields.price||0; o.area=+fields.area||0;
  o.loc=fields.loc; o.tel=fields.tel; o.dsc=fields.dsc;
 }
 btn.disabled=false; btn.textContent='შენახვა';
 el('esheet').classList.remove('on');
 draw();
}
el('bEdit').onclick=openEdit;
el('esave').onclick=saveEdit;
el('ecancel').onclick=()=>el('esheet').classList.remove('on');
el('esheet').onclick=e=>{if(e.target===el('esheet'))el('esheet').classList.remove('on')};

/* ---------- გადართვა ---------- */
el('secs').querySelectorAll('button').forEach(b=>b.onclick=()=>{
 el('secs').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
 b.classList.add('on'); SEC=b.dataset.s; cur=0;
 el('secs').classList.toggle('amber',SEC==='active'); draw();
});
el('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{
 el('tabs').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
 b.classList.add('on'); TAB=b.dataset.k; cur=0; draw();
});

/* ---------- ჟესტები ---------- */
let tx=0,ty=0,t0=0;
el('main').addEventListener('touchstart',e=>{
 if(e.touches.length!==1)return;
 tx=e.touches[0].clientX; ty=e.touches[0].clientY; t0=Date.now();
},{passive:true});
el('main').addEventListener('touchend',e=>{
 const t=e.changedTouches[0]; if(!t)return;
 const ax=t.clientX-tx, ay=t.clientY-ty, list=Q();
 if(Date.now()-t0<600&&Math.abs(ax)>64&&Math.abs(ax)>Math.abs(ay)*1.8&&list.length>1){
  cur=(cur+(ax<0?1:-1)+list.length)%list.length; draw();
 }
},{passive:true});

/* ---------- კლავიატურა ---------- */
addEventListener('keydown',e=>{
 /* ⚠️ 2026-08-26: კორექტირების ველებში ტექსტის აკრეფისას ("ავეჯით",
    "ჰოლი" და მისთ.) ეს იგივე ასოები predetermined-ცნობებად არ უნდა
    ავიღოთ — თორემ ტექსტის შეყვანისას ჩანაწერი შემთხვევით
    დადასტურდებოდა/ჰოლდზე გადავიდოდა. */
 if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')){
  if(e.key==='Escape')el('esheet').classList.remove('on');
  return;
 }
 if(el('lbx').classList.contains('on')){el('lbx').classList.remove('on');return}
 const k=e.key.toLowerCase(), list=Q();
 if(k==='a'){e.preventDefault();if(SEC!=='active')act('ok')}
 else if(k==='r'){e.preventDefault();el('sheet').classList.add('on')}
 else if(k==='h'){e.preventDefault();act('hold')}
 else if(k==='e'){e.preventDefault();openEdit()}
 else if(e.key==='ArrowRight'&&list.length){cur=(cur+1)%list.length;draw()}
 else if(e.key==='ArrowLeft'&&list.length){cur=(cur-1+list.length)%list.length;draw()}
 else if(e.key==='Escape'){el('sheet').classList.remove('on');el('esheet').classList.remove('on')}
});
el('lbx').onclick=()=>el('lbx').classList.remove('on');
addEventListener('resize',()=>{clearTimeout(window.__rz);window.__rz=setTimeout(draw,220)});

/* ⚠️ ადრე ეს გვერდი მონაცემს მხოლოდ ერთხელ, პირველ ჩატვირთვაზე
   იღებდა — თუ ადმინი მეილიდან რომელიმე განცხადებას დაადასტურებდა
   (ან სხვა ჩანართიდან/მოწყობილობიდან), უკვე ღია მოდერაციის ჩანართი
   ამას ვერ ხედავდა, სანამ მთლიან გვერდს არ განაახლებდა — და
   ჩანდა, თითქოს დადასტურება "არ იმუშავა", თუმცა სინამდვილეში
   ბაზა უკვე სწორად იყო განახლებული. ახლა: (1) ხელით განახლების
   ღილაკი ყოველთვის ხელმისაწვდომია თავში, (2) ჩანართში დაბრუნებისას
   (tab/window ისევ გააქტიურდება) თავისით ახლდება სია. */
el('rfrTop').onclick=load;
document.addEventListener('visibilitychange',()=>{ if(!document.hidden)load(); });
addEventListener('focus',()=>{ if(!document.hidden)load(); });

load();
</script>
