<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0E1A16">
<title>MyMamuli.ge — მომხმარებლები</title>
<style>
:root{--ink:#0E1A16;--ink2:#4A5A54;--mute:#93A09B;--line:#E4E8E6;--brand:#0F6B4F;--sand:#F7F5F1;
 --amber:#C8873A;--down:#C0453B;--sh:0 1px 2px rgba(14,26,22,.05),0 8px 24px rgba(14,26,22,.07)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Georgian",sans-serif;
 color:var(--ink);background:#F4F6F5;-webkit-text-size-adjust:100%}
button,input{font:inherit}

header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.hb{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:7px;font-weight:700;font-size:16px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.logo b{color:var(--brand)}
.nav{display:flex;gap:5px;background:var(--sand);padding:3px;border-radius:10px}
.nav a{height:30px;padding:0 13px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink2);
 display:flex;align-items:center;text-decoration:none}
.nav a.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(14,26,22,.10)}
.sp{flex:1}
.kbtn{height:32px;padding:0 13px;border:1px solid var(--line);border-radius:9px;background:#fff;
 color:var(--ink2);font-size:12.5px;cursor:pointer}

main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.warn{background:#FEF6E7;border:1px solid #F5E3C0;color:#8A5D14;font-size:12.5px;padding:10px 14px;
 border-radius:10px;margin-bottom:14px;text-align:center}
.warn button{background:#8A5D14;color:#fff;padding:5px 11px;border-radius:8px;font:600 12px inherit;margin-left:8px;border:0;cursor:pointer}

.topbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.topbar h1{font-size:18px;font-weight:700;letter-spacing:-.3px}
.topbar .cnt{font-size:13px;color:var(--mute)}
.search{margin-left:auto;position:relative;min-width:220px}
.search input{width:100%;height:36px;border:1px solid var(--line);border-radius:9px;padding:0 12px;
 background:#fff;outline:0}
.search input:focus{border-color:var(--brand)}

.tbl{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
.trow{display:grid;grid-template-columns:1.3fr 1.5fr 1.2fr .8fr .9fr .7fr auto;gap:10px;align-items:center;
 padding:12px 16px;border-bottom:1px solid var(--line);font-size:13.5px}
.trow:last-child{border-bottom:0}
.trow.head{background:var(--sand);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;
 color:var(--mute);padding:10px 16px}
.tname{font-weight:600}
.tsub{color:var(--mute);font-size:12px;margin-top:2px}
.tel{font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;font:600 11px/1 inherit;padding:5px 8px;border-radius:7px}
.badge.act{background:#EDF5F1;color:var(--brand)}
.badge.blk{background:#FDF0EF;color:var(--down)}
.badge.comp{background:#EEF3FA;color:#2F5C93;margin-left:5px}
.cnts{font-size:12px;color:var(--ink2)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ab{height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--line);background:#fff;
 font-size:11.5px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap}
.ab:hover{border-color:var(--brand);color:var(--brand)}
.ab.dn{color:var(--down)}
.ab.dn:hover{border-color:var(--down);color:var(--down)}
.ab.on{background:var(--brand);border-color:var(--brand);color:#fff}
.empty{padding:40px 16px;text-align:center;color:var(--mute);font-size:13.5px}

.edit-row{display:none;padding:12px 16px;background:var(--sand);border-bottom:1px solid var(--line);
 gap:8px;flex-wrap:wrap;align-items:center}
.edit-row.on{display:flex}
.edit-row input{height:32px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:#fff}

/* ფურცელი — გასაღების შეყვანა */
#lsheet{display:none;position:fixed;inset:0;z-index:90;background:rgba(14,26,22,.42);align-items:center;justify-content:center;padding:16px}
#lform{background:#fff;border-radius:16px;padding:22px;width:min(340px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)}

@media(max-width:900px){
 .trow{grid-template-columns:1fr;gap:4px}
 .trow.head{display:none}
 .trow{padding:14px 16px}
 .acts{justify-content:flex-start;margin-top:8px}
}
</style>
</head>
<body>

<header>
  <div class="hb">
    <a class="logo" href="admin.html">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M3 19.5V8.2L12 3l9 5.2v11.3" stroke="#0F6B4F" stroke-width="2" stroke-linejoin="round"/><path d="M3 19.5h18" stroke="#0F6B4F" stroke-width="2" stroke-linecap="round"/><path d="M9.5 19.5v-5.3h5v5.3" stroke="#C8873A" stroke-width="2" stroke-linejoin="round"/></svg>
      My<b>Mamuli</b>
    </a>
    <div class="nav">
      <a href="admin.html">ანალიტიკა</a>
      <a href="mod.html">მოდერაცია</a>
      <a href="users.html" class="on">მომხმარებლები</a>
    </div>
    <div class="sp"></div>
    <button class="kbtn" id="kbtn">ადმინის სესია</button>
  </div>
</header>

<main>
  <div class="warn" id="warn" style="display:none"></div>

  <div class="topbar">
    <h1>რეგისტრირებული მომხმარებლები</h1>
    <span class="cnt" id="cnt"></span>
    <div class="search"><input id="q" placeholder="ძებნა — სახელი, ელფოსტა, ტელეფონი…"></div>
  </div>

  <div class="tbl" id="tbl"></div>
</main>

<div id="lsheet">
  <form id="lform" autocomplete="on">
    <h3 style="font-size:16px;font-weight:700;margin-bottom:14px">ადმინის სესია</h3>
    <input type="text" name="username" autocomplete="username" value="admin" style="position:absolute;left:-9999px;top:auto" tabindex="-1" aria-hidden="true">
    <label style="font-size:12.5px;color:var(--ink2);display:block;margin-bottom:6px">ADMIN_KEY</label>
    <input type="password" id="lpass" name="password" autocomplete="current-password" placeholder="ADMIN_KEY"
      style="width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:14px;margin-bottom:8px;box-sizing:border-box">
    <div id="lerr" style="color:var(--down);font-size:12.5px;min-height:16px;margin-bottom:8px"></div>
    <div style="display:flex;gap:8px">
      <button type="button" id="lcancel" style="flex:1;height:42px;border-radius:10px;background:var(--sand);font:inherit;font-weight:600;border:0;cursor:pointer">გაუქმება</button>
      <button type="submit" style="flex:1;height:42px;border-radius:10px;background:var(--brand);color:#fff;font:inherit;font-weight:600;border:0;cursor:pointer">შესვლა</button>
    </div>
  </form>
</div>

<script>
const el=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate=ms=>ms?new Date(ms).toLocaleDateString('ka-GE',{year:'numeric',month:'short',day:'numeric'}):'—';

let AUTHED=false, USERS=[], Q='';

/* ---------- ადმინის სესია — იგივე პატერნი, რაც mod.html-ში ---------- */
async function chkAuth(){
 try{const r=await fetch('/api/admin',{cache:'no-store'});AUTHED=r.ok&&(await r.json()).ok}
 catch(e){AUTHED=false}
 return AUTHED;
}
function openLogin(){
 el('lerr').textContent=''; el('lpass').value=''; el('lsheet').style.display='flex';
 setTimeout(()=>el('lpass').focus(),30);
}
function closeLogin(){ el('lsheet').style.display='none'; }
el('lcancel').onclick=closeLogin;
el('lsheet').onclick=e=>{ if(e.target===el('lsheet'))closeLogin(); };
el('lform').onsubmit=async e=>{
 e.preventDefault();
 const k=el('lpass').value.trim(); if(!k)return;
 const btn=el('lform').querySelector('button[type=submit]'); btn.disabled=true;
 let r;
 try{r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({key:k})})}catch(err){el('lerr').textContent='კავშირი ვერ დამყარდა.';btn.disabled=false;return}
 AUTHED=r.ok; btn.disabled=false;
 if(!AUTHED){el('lerr').textContent=r.status===429?'ძალიან ბევრი მცდელობა — სცადე ერთ საათში.':'გასაღები არ ემთხვევა.';return}
 closeLogin(); load();
};
async function logout(){
 try{await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({out:1})})}catch(e){}
 AUTHED=false;
}
el('kbtn').onclick=()=>{ if(AUTHED){logout().then(load)} else {openLogin()} };

/* ---------- ჩატვირთვა ---------- */
async function load(){
 const w=el('warn');
 if(!AUTHED)await chkAuth();
 if(!AUTHED){
  w.style.display=''; w.innerHTML='შედი გასაღებით მომხმარებლების სანახავად.<button id="sk">შესვლა</button>';
  el('sk').onclick=openLogin; el('tbl').innerHTML=''; el('cnt').textContent=''; return;
 }
 w.style.display='none';
 let d=null;
 try{
  const r=await fetch('/api/admin-users?limit=200'+(Q?'&q='+encodeURIComponent(Q):''),{cache:'no-store'});
  if(r.status===401){AUTHED=false;load();return}
  if(r.ok)d=await r.json();
 }catch(e){}
 if(!d){w.style.display='';w.innerHTML='<code>/api/admin-users</code> ჯერ არ მუშაობს.';return}
 USERS=d.users||[];
 draw();
}

function draw(){
 el('cnt').textContent=USERS.length+' მომხმარებელი';
 const t=el('tbl');
 if(!USERS.length){
  t.innerHTML='<div class="empty">მომხმარებელი ვერ მოიძებნა.</div>';
  return;
 }
 t.innerHTML=
  '<div class="trow head"><div>სახელი</div><div>ტელეფონი</div><div>ელფოსტა</div><div>სტატუსი</div>'+
   '<div>რეგისტრაცია</div><div>განცხადება</div><div></div></div>'+
  USERS.map(u=>{
   const blocked=u.status==='blocked';
   return '<div data-id="'+esc(u.id)+'">'+
    '<div class="trow" data-id="'+esc(u.id)+'">'+
     '<div><div class="tname">'+esc(u.name||'—')+'</div>'+
      '<div class="tsub">'+(u.who==='co'?esc(u.comp||'იურ. პირი'):'ფიზ. პირი')+'</div></div>'+
     '<div class="tel">'+esc(u.phone_full||'—')+'</div>'+
     '<div>'+esc(u.email)+(u.email_ok?'':' <span class="tsub">(დაუდასტურებელი)</span>')+'</div>'+
     '<div><span class="badge '+(blocked?'blk':'act')+'">'+(blocked?'დაბლოკილი':'აქტიური')+'</span>'+
      (u.comp_ok?'<span class="badge comp">✓ ულიმიტო</span>':'')+'</div>'+
     '<div>'+fmtDate(u.created)+'</div>'+
     '<div class="cnts">'+(u.lst_n||0)+' გან. · '+(u.req_n||0)+' მოთხ.</div>'+
     '<div class="acts">'+
      '<button class="ab" data-a="edit">რედაქტირება</button>'+
      '<button class="ab '+(u.comp_ok?'on':'')+'" data-a="comp_ok">ულიმიტო</button>'+
      (blocked
        ?'<button class="ab" data-a="unblock">განბლოკვა</button>'
        :'<button class="ab dn" data-a="block">დაბლოკვა</button>')+
      '<button class="ab dn" data-a="delete">წაშლა</button>'+
     '</div>'+
    '</div>'+
    '<div class="edit-row" id="edit-'+esc(u.id)+'">'+
     '<input placeholder="სახელი" value="'+esc(u.name||'')+'" data-f="name" style="flex:1;min-width:140px">'+
     '<input placeholder="ტელეფონი" value="'+esc(u.phone_full||'')+'" data-f="phone_full" style="flex:1;min-width:140px">'+
     '<button class="ab on" data-a="save-edit">შენახვა</button>'+
     '<button class="ab" data-a="cancel-edit">გაუქმება</button>'+
    '</div>'+
   '</div>';
  }).join('');

 t.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.closest('[data-id]').dataset.id,b.dataset.a,b));
}

async function act(id,action,btn){
 if(action==='edit'){ el('edit-'+id).classList.add('on'); return }
 if(action==='cancel-edit'){ el('edit-'+id).classList.remove('on'); return }
 if(action==='save-edit'){
  const row=el('edit-'+id);
  const name=row.querySelector('[data-f=name]').value;
  const phone_full=row.querySelector('[data-f=phone_full]').value;
  await send(id,'edit',{name,phone_full}); load(); return;
 }
 if(action==='comp_ok'){
  const on=btn.classList.contains('on');
  await send(id,'comp_ok',{value:!on}); load(); return;
 }
 if(action==='block'){
  if(!confirm('დავბლოკო ეს მომხმარებელი? ვეღარ შევა კაბინეტში და ახალ განცხადებას ვერ დადებს.'))return;
  await send(id,'block',{}); load(); return;
 }
 if(action==='unblock'){ await send(id,'unblock',{}); load(); return }
 if(action==='delete'){
  if(!confirm('წავშალო ეს მომხმარებელი? თუ განცხადება/მოთხოვნა აქვს, სრულად ვერ წაიშლება — დაიბლოკება მის ნაცვლად.'))return;
  const r=await send(id,'delete',{});
  if(r&&r.note)alert(r.note);
  load(); return;
 }
}
async function send(id,action,extra){
 try{
  const r=await fetch('/api/admin-users',{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({id,action,...extra})});
  return await r.json().catch(()=>({}));
 }catch(e){ alert('ვერ მოხერხდა — სცადე ხელახლა.'); return null }
}

let qT=null;
el('q').oninput=()=>{ clearTimeout(qT); qT=setTimeout(()=>{Q=el('q').value.trim();load()},300) };

load();
</script>
</body>
</html>
